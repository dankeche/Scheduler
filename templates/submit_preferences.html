{% extends "base.html" %}
{% block content %}
<div class="card shadow col-md-8 mx-auto">
    <div class="card-header bg-primary text-white">
        <h4>Submit Your Shift Preferences</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Do you like Night shifts?</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="pref_night" value="1" checked>
                    <label class="form-check-label">Yes, I can do Night shifts</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="pref_night" value="0">
                    <label class="form-check-label">No, I prefer not to do Night shifts</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Maximum Night Shifts per Week</label>
                <select class="form-select" name="max_night_shifts">
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Preferred Off Days (comma separated)</label>
                <input type="text" class="form-control" name="pref_off_days" 
                       placeholder="e.g. 1,4,7 (Day numbers)">
                <small class="text-muted">Example: 1,4 (Monday and Thursday)</small>
            </div>

            <button type="submit" class="btn btn-primary">Save Preferences</button>
            <a href="/my-schedule" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
